<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__NONCE__'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<style>
  body { margin: 12px; color: #242829; font: 14px/1.5 system-ui, sans-serif; }
  img { display: block; max-width: 100%; height: auto; margin: auto; }
  #status { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<p id="status" role="status">正在生成图表…</p>
<pre id="source" hidden>__SOURCE__</pre>
<script nonce="__NONCE__" src="__RENDERER__"></script>
<script nonce="__NONCE__">
  (async () => {
    const status = document.getElementById('status')
    const source = document.getElementById('source').textContent
    if (!window.mermaid) {
      status.textContent = '图表渲染器加载失败，请重新打开预览。'
      return
    }
    try {
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', htmlLabels: false,
        suppressErrorRendering: true, maxTextSize: 50000, maxEdges: 500 })
      await mermaid.parse(source)
      const { svg } = await mermaid.render('diagram', source)
      const image = new Image()
      image.alt = 'Mermaid 图表'
      image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)
      await image.decode()
      status.replaceWith(image)
    } catch (error) {
      const detail = String(error?.message || '').slice(0, 500)
      status.textContent = '无法生成 Mermaid 图表，请检查图表类型与语法。' + (detail ? '\n' + detail : '')
    }
  })()
</script>
</html>
